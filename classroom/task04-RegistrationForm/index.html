<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Student Registration Form</h1>
    <table style="margin: 0 auto;"border="1" cellpadding="20" cellspacing="0" width="50%">
        <tr >
            <th colspan="6">Registration Form</th>
        </tr>
        <tr>
            <td>Full name</td>
            <td>
                <input type="text" name="full_name" placeholder="Enter your full name" required>
            </td>
        </tr>
        <tr>
            <td >Email</td>
            <td>
                <input type="text" name="email" placeholder="Enter your email" required>
            </td>
        </tr>
        <tr>
            <td>Phone number</td>
            <td>
                <input type="tel" name="phonenumber" placeholder="Enter your phone number" required>
            </td>
        </tr>
        <tr>
            <td >Date of Birth</td>
            <td>
                <input type="date" name="dateofbirth" required>
            </td>
        </tr>
        <tr>
            <td >Gender</td>
            <td>
                <input type="radio" name="gender" value="Male" required >Male

                <input type="radio" name="gender" value="Female" required > Female

                <input type="radio" name="gender" value="others"  required> others
            </td>
        </tr>
        <tr>
            <td >Skills</td>
            <td>
                <input type="checkbox" name="skills" value="html" required>HTML
                <input type="checkbox" name="skills" value="css" required>CSS
                <input type="checkbox" name="skills" value="js" required>js
            </td>
        </tr>
        <tr>
            <td>Course</td>
            <td>
                <select name="course " requires>
                    <option value="">Select a course</option>
                    <option vslue="CSS">CSS</option>
                    <option vslue="HTML">HTML</option>
                    <option vslue="JavaScript">JavaScript</option>
                    <option vslue="Reactjs">Reactjs</option>

                </select>
            </td>
        </tr>
        <tr>
            <td  style="text-align: center;"colspan="6">&copy; 2026 All right reserved by Raghav Singh</td>
        </tr>
    </table>
</body>
</html>
